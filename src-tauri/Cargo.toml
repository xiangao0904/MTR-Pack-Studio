[package]
name = "mtr-pack-studio"
version = "0.1.0"
description = "MTR resource pack studio"
authors = ["MTR Pack Studio contributors"]
edition = "2021"

[lib]
name = "mtr_pack_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
