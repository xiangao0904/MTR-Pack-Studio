    <path d="m43 320 31 3v17l-31-4Z" fill="#242e35" stroke="#3a454d"/>

    <!-- Far wheels and axles sit behind the visible bogie side frame. -->
    <use href="#wheel" transform="translate(98 333) scale(.82)"/>
    <use href="#wheel" transform="translate(177 345) scale(.87)"/>
    <path d="m64 348 34-15m45 27 34-15" stroke="#3a454d" stroke-width="6"/>
    <use href="#wheel" transform="translate(64 348)"/>
    <use href="#wheel" transform="translate(143 360)"/>

