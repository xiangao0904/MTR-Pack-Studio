    <path d="m175 137 25 4" stroke="#48575f" stroke-width="2"/>
    <path d="m172 154 9 2 18 94-9 1Zm63 13 7 7 21 76-6 1Z" fill="#34434c"/>
    <path d="m215 150 20 105" stroke="#38474f" stroke-width="2"/>
    <path d="m211 254 10-31m-16 10 28-14m25 33-7-21m-9-2 18 5" stroke="#67747c" stroke-width="1.7"/>
    <path d="m177 271 102-3 7 18-106 4Z" fill="#222d34"/>
    <g fill="#57646c" stroke="#18232a" stroke-width="2">
