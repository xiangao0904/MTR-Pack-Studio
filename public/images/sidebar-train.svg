<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 40 347 400" fill="none">
  <defs>
    <linearGradient id="side" x1="90" y1="115" x2="80" y2="308" gradientUnits="userSpaceOnUse">
      <stop stop-color="#394248"/><stop offset="1" stop-color="#293238"/>
    </linearGradient>
    <linearGradient id="cab" x1="171" y1="121" x2="294" y2="302" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3e474e"/><stop offset="1" stop-color="#303940"/>
    </linearGradient>
    <linearGradient id="glass" x1="198" y1="129" x2="264" y2="258" gradientUnits="userSpaceOnUse">
      <stop stop-color="#242d33"/><stop offset="1" stop-color="#171e23"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="60" x2="0" y2="435" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".65"/><stop offset=".24" stop-color="white"/>
      <stop offset=".8" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="scene"><path d="M0 40h347v400H0z" fill="url(#fade)"/></mask>
    <!-- A wheel is drawn as a rim, recessed disc and hub, in side perspective. -->
    <g id="wheel">
      <ellipse rx="13" ry="19" fill="#171e23" stroke="#424c53" stroke-width="3"/>
      <ellipse rx="8.5" ry="14" fill="#242d33" stroke="#303a41" stroke-width="2"/>
      <ellipse rx="3.5" ry="6" fill="#4a555d"/>
    </g>
    <g id="spring" stroke="#4a555d" stroke-width="1.7" stroke-linejoin="round">
      <path d="M-7-7H7M-7-4 7-2-7 1 7 4-7 7H7"/>
    </g>
  </defs>
  <g mask="url(#scene)" stroke-linejoin="round" stroke-linecap="round">
