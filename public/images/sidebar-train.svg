    <path d="m238 332 12-3 18 16-13 8Z" fill="#596771"/>
    <path d="m245 335 5-1 13 12-5 3Z" fill="#2b3943"/>
    <path d="m254 340 18-4 12 9-2 16-19 5-11-10Z" fill="#465660" stroke="#6b7982" stroke-width="1.4"/>
    <path d="m263 346 13-4 1 12-11 4-1-5 5-2v-3l-7 2Z" fill="#17252e"/>
    <path d="m253 357 9 9 20-5-3 6-18 5-9-8Z" fill="#2c3c46" stroke="#4b5c67"/>
    <path d="m222 329-3 14c-1 7 9 12 15 6l6-7m17-15 11 4 9 3" stroke="#53616b" stroke-width="2.3"/>
    <path d="m210 336-7 11 23 7" stroke="#394954" stroke-width="2"/>
  </g>
