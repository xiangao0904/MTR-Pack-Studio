    <path d="M135 100c29-9 48-4 70 10 28 18 47 43 58 72l24 97-113 4-22-134c-4-23-9-40-17-49Z" fill="url(#cab)"/>
    <path d="M150 108c18-4 35 2 51 13 25 17 42 38 53 65l20 75-91 3-19-115c-3-19-8-31-14-41Z" fill="url(#glass)" stroke="#536069" stroke-width="1.2"/>
